name: Build ImmortalWrt (4 targets)

# 手动触发，不设定时任务。4 个目标并行编，首次全量每台约 1-3 小时，GitHub 单任务上限 6 小时。
on:
  workflow_dispatch:

env:
  REPO_URL: https://github.com/immortalwrt/immortalwrt.git
  DIY_P1_SH: diy-part1.sh
  DIY_P2_SH: diy-part2.sh
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04
    # run #4 教训：Clone 步骤把 openwrt 软链到 /workdir/openwrt，cd openwrt 后
    # 相对父目录路径解析为 /workdir 而非仓库根，diy 脚本与 config 全找不到。本轮改用
    # $GITHUB_WORKSPACE 绝对路径引用仓库根文件，cwd 仍留在 openwrt 内。
    # 只发 Release：Release 步骤用 gh 创建/上传同一 Release，需写 contents 权限。
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64
            config: configs/x86_64.config
            branch: openwrt-24.10
            check_device: "CONFIG_TARGET_x86_64_DEVICE_generic=y"
            check_packages: "luci-app-passwall luci-app-passwall2 luci-app-openclash luci-app-mosdns luci-app-homeproxy luci-app-ssr-plus luci-theme-argon luci-app-argon-config kmod-usb-net-rndis"
          - target: r4s
            config: configs/r4s.config
            branch: openwrt-24.10
            check_device: "CONFIG_TARGET_DEVICE_rockchip_armv8_DEVICE_friendlyarm_nanopi-r4s=y"
            check_packages: "luci-app-passwall luci-app-passwall2 luci-app-openclash luci-app-mosdns luci-app-homeproxy luci-app-ssr-plus luci-theme-argon luci-app-argon-config kmod-usb-net-rndis"
          - target: cr660x
            config: configs/cr660x.config
            branch: openwrt-24.10
            check_device: "CONFIG_TARGET_DEVICE_ramips_mt7621_DEVICE_xiaomi_mi-router-cr6606=y"
            check_packages: "luci-app-passwall2"
          - target: athena
            config: configs/athena.config
            # 注意：雅典娜 RE-CS-02 在 openwrt-24.10 里没有设备 profile（仅 master 有），
            # 本项默认走 master，见 README；如用户决定不编雅典娜，删掉本项即可。
            branch: master
            check_device: "CONFIG_TARGET_DEVICE_qualcommax_ipq60xx_DEVICE_jdcloud_re-cs-02=y"
            check_packages: "luci-app-passwall luci-app-passwall2 luci-app-openclash luci-app-mosdns luci-app-homeproxy luci-app-ssr-plus luci-theme-argon kmod-usb-net-rndis"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        # run #1 教训：easimon/maximize-build-space 跑完后根分区反而 100%（仅剩 100M），
        # 随后 apt 安装依赖时写盘失败，4 个任务全在 "Install build dependencies" 倒下，
        # 我们的配置/feeds 根本没跑到。改直接删 runner 上最大的预装目录（都在根分区上，
        # 正好是 apt 写盘的位置），不做 LVM 重挂载。
        # run #3 教训：删掉 maximize-build-space 后 /workdir 不再被自动创建，
        # "Clone source code" 的 working-directory: /workdir 启动即报 No such file or directory，
        # 4 个任务全倒在这一步（此前步骤均已成功）。这里显式建目录并归当前用户所有。
        run: |
          df -hT
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/hostedtoolcache \
            /usr/local/share/boost /opt/az /usr/share/swift /opt/microsoft
          sudo apt-get clean
          sudo mkdir -p /workdir
          sudo chown "$(whoami)" /workdir
          df -hT

      - name: Install build dependencies
              # run #6/#7 教训：r4s 编 u-boot 时 Download packages 的 prereq 检查报 python3-pyelftools 缺失（exit 2），须随依赖一起装。
              # run #8 教训：athena（master）编 gn [host] 时报 error: invalid value 'c++23' in '-std=c++23'，因 ubuntu-22.04 自带 clang 14 不认识 C++23 拼写（需 Clang 17+）。加 apt.llvm.org 源装 clang-18/lld-18，并把 clang/clang++/lld 默认指向 18 版，其余不动、仍用 ubuntu-22.04。
        run: |
          df -hT
          sudo apt-get update -y
          sudo apt-get install -y gnupg
          curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key | sudo gpg --dearmor -o /usr/share/keyrings/llvm-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/llvm-archive-keyring.gpg] http://apt.llvm.org/jammy/ llvm-toolchain-jammy-18 main" | sudo tee /etc/apt/sources.list.d/llvm.list >/dev/null
          sudo apt-get update -y
          sudo apt-get install -y ack antlr3 asciidoc autoconf automake autopoint binutils bison \
            build-essential bzip2 ccache clang clang-18 cmake cpio curl device-tree-compiler ecj fastjar flex \
            gawk gettext gcc-multilib g++-multilib git gperf haveged help2man intltool lib32gcc-s1 \
            libc6-dev-i386 libelf-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev \
            libncurses5-dev libncursesw5 libncursesw5-dev libreadline-dev libssl-dev libtool lld lld-18 \
            lrzsz mkisofs msmtp nano ninja-build p7zip p7zip-full patch pkgconf python2.7 python3 \
            python3-pyelftools python3-pip python3-ply python3-docutils qemu-utils re2c rsync scons squashfs-tools \
            subversion swig texinfo uglifyjs upx-ucl unzip vim wget xmlto xxd zlib1g-dev zstd
          sudo update-alternatives --install /usr/bin/clang clang /usr/bin/clang-18 100
          sudo update-alternatives --install /usr/bin/clang++ clang++ /usr/bin/clang++-18 100
          if [ -x /usr/bin/lld-18 ]; then sudo update-alternatives --install /usr/bin/lld lld /usr/bin/lld-18 100; fi
          clang --version
          clang++ --version
          sudo timedatectl set-timezone "$TZ" || true

      - name: Clone source code
        working-directory: /workdir
        run: |
          df -hT
          git clone --depth 1 "$REPO_URL" -b "${{ matrix.branch }}" openwrt
          ln -sf /workdir/openwrt "$GITHUB_WORKSPACE/openwrt"

      - name: Cache toolchain
        uses: actions/cache@v4
        with:
          path: |
            openwrt/staging_dir/host*
            openwrt/staging_dir/tool*
            openwrt/.ccache
          key: immortalwrt-${{ matrix.branch }}-${{ matrix.target }}-${{ hashFiles(matrix.config) }}
          restore-keys: |
            immortalwrt-${{ matrix.branch }}-${{ matrix.target }}-

      - name: Run diy-part1 (before feeds update)
        run: |
          cd openwrt
          chmod +x "$GITHUB_WORKSPACE/$DIY_P1_SH"
          "$GITHUB_WORKSPACE/$DIY_P1_SH"

      - name: Update and install feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Run diy-part2 (after feeds install)
        env:
          CONFIG_FILE: ${{ github.workspace }}/${{ matrix.config }}
        run: |
          cd openwrt
          chmod +x "$GITHUB_WORKSPACE/$DIY_P2_SH"
          CONFIG_FILE="$CONFIG_FILE" "$GITHUB_WORKSPACE/$DIY_P2_SH"

      - name: Load custom configuration
        run: |
          cd openwrt
          cp "$GITHUB_WORKSPACE/${{ matrix.config }}" .config
          make defconfig
          echo "=== device actually selected ==="
          grep -q "${{ matrix.check_device }}" .config || { echo "MISSING device: ${{ matrix.check_device }}"; exit 1; }
          echo "OK device: ${{ matrix.check_device }}"
          echo "=== every DEVICE line in the source config must survive defconfig ==="
          while IFS= read -r line; do
            grep -q "^${line}$" .config && echo "OK   $line" || { echo "DROPPED device line: $line"; exit 1; }
          done < <(grep '^CONFIG_TARGET_' "$GITHUB_WORKSPACE/${{ matrix.config }}" | grep 'DEVICE_')
          echo "=== required packages actually selected ==="
          for pkg in ${{ matrix.check_packages }}; do
            grep -q "CONFIG_PACKAGE_${pkg}=y" .config && echo "OK   $pkg" || { echo "MISSING $pkg (defconfig dropped it: feed/package name wrong)"; exit 1; }
          done

      - name: Download packages
        run: |
          cd openwrt
          make download -j8
          find dl -size -1024c -exec ls -l {} \;
          find dl -size -1024c -exec rm -f {} \;

      - name: Compile firmware
              # run #5 教训：x86_64 在 Compile firmware 里 6 小时超时被取消。并行 make 在
              # mihomo 处报错后，原来的 make -j1 单线程重编在剩余时间内根本编不完。
              # 改为先并行重试一次（已编好的工作增量复用），仍失败才单线程详细日志。
              # run #10 教训：cr660x 在 toolchain/binutils（gas 的 as-new 链接目标）上 exit 2，
              # 且最后一次尝试的 binutils 计时仅 0.48 秒——并行重试只是在重复跑同一个已坏的
              # 增量构建状态，根本没有重编 binutils。第三次重试前先 make toolchain/clean，
              # 把工具链清干净再并行重编（仍失败才单线程详细日志），让重试真正重建、
              # 让详细日志里出现真正的报错命令，而不是 0.48 秒的重复失败。
        run: |
          cd openwrt
          echo -e "$(nproc) thread compile"
          make -j"$(nproc)" || make -j"$(nproc)" || { echo "parallel compile failed twice; cleaning toolchain for a fresh retry"; make toolchain/clean || true; make -j"$(nproc)" || make -j1 V=s; }

      - name: Organize files
        id: organize
        run: |
          cd openwrt/bin/targets/*/*
          rm -rf packages
          echo "FIRMWARE=$PWD" >> "$GITHUB_ENV"
          echo "FILE_DATE=_$(date +"%Y%m%d%H%M")" >> "$GITHUB_ENV"
          ls -lh

      - name: Publish firmware to Release (no artifact)
        # 只发 Release：4 个并行任务共用一个 Release（tag build-<run number>）。
        # 首个任务建 Release，其余任务在循环里等它出现；同名文件用 --clobber 覆盖
        # （重跑同一 run number 时复用同一 tag）。只传镜像文件，不传 sha256sums
        # 与 buildinfo（各目标同名，会互相覆盖）。
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          shopt -s nullglob
          files=( "$FIRMWARE"/*.img* "$FIRMWARE"/*.bin "$FIRMWARE"/*.vmdk "$FIRMWARE"/*.qcow2* "$FIRMWARE"/*.vhdx* )
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No firmware files found in $FIRMWARE"
            ls -lh "$FIRMWARE"
            exit 1
          fi
          ls -lh "${files[@]}"
          TAG="build-${{ github.run_number }}"
          for i in 1 2 3 4 5 6; do
            if gh release view "$TAG" >/dev/null 2>&1; then break; fi
            if gh release create "$TAG" --title "ImmortalWrt build #${{ github.run_number }}" --notes "ImmortalWrt firmware built by GitHub Actions. Run #${{ github.run_number }}, commit ${{ github.sha }}. Back up your existing router configuration before flashing." 2>/dev/null; then break; fi
            sleep 15
          done
          gh release view "$TAG" >/dev/null || { echo "Release $TAG not found after retries"; exit 1; }
          gh release upload "$TAG" --clobber -- "${files[@]}"
          gh release view "$TAG" --json assets --jq '.assets[].name'
